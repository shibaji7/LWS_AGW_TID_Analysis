# Configuration for the CONUS DIDBASE download + RSF scaling/plotting pipeline.
#
# Loaded by utils.py (SZA regimes / station-year RSF overrides) and read
# directly by the CLI scripts for their default years/paths/plot windows.
# Every script still accepts its previous environment-variable overrides;
# this file only changes the *defaults*.

[download]
years = [2022, 2023, 2024, 2025]
month_start = 4          # April
month_end = 9            # September
output_dir = "Data/didbase_giro_scaled"
retries = 3
# Raw ionogram formats fetched by `didbase_pipeline.py --raw`, tried in order
# per station-day; the first format with data wins. Feeds plot_viterbi.py.
raw_formats = ["RSF", "MMM"]

[stations]
country_names = ["USA", "US", "U.S.A.", "UNITED STATES", "UNITED STATES OF AMERICA"]
lat_min = 24
lat_max = 50
lon_min = -125
lon_max = -66
# Stations present in DIDBASE but missing from the public Digisonde
# instrument catalogue; supplied here from prior project metadata.
[[stations.extra]]
ursi = "WS833"
country = "USA"
lat = 32.40
long = -106.40
location = "White Sands Missile Range (project station metadata)"

# ---------------------------------------------------------------------------
# Solar-zenith-angle regimes for local RSF Viterbi scaling (rsf_batch_scaler.py)
# ---------------------------------------------------------------------------
[sza_regimes]
day_max_deg = 80.0        # SZA <  80 deg -> "day"
twilight_max_deg = 100.0  # 80-100 deg    -> "twilight"; >=100 deg -> "night"

[sza_regimes.day]
dbscan_eps = 0.010
dbscan_min_samples = 4
min_amp_dB = 27.0
[sza_regimes.day.E]
h_lo = 100.0
h_hi = 150.0
sigma_trans_km = 8.0
max_jump_km = 20.0
f_lo = 2.0
f_hi = 5.0
[sza_regimes.day.F2]
h_lo = 180.0
h_hi = 420.0
sigma_trans_km = 25.0
max_jump_km = 40.0
f_lo = 2.0
f_hi = 12.0

[sza_regimes.twilight]
dbscan_eps = 0.010
dbscan_min_samples = 4
min_amp_dB = 27.0
[sza_regimes.twilight.E]
h_lo = 100.0
h_hi = 150.0
sigma_trans_km = 10.0
max_jump_km = 25.0
f_lo = 2.0
f_hi = 5.0
[sza_regimes.twilight.F2]
h_lo = 220.0
h_hi = 470.0
sigma_trans_km = 35.0
max_jump_km = 55.0
f_lo = 2.0
f_hi = 12.0

[sza_regimes.night]
dbscan_eps = 0.010
dbscan_min_samples = 4
min_amp_dB = 27.0
[sza_regimes.night.E]
h_lo = 100.0
h_hi = 150.0
sigma_trans_km = 12.0
max_jump_km = 30.0
f_lo = 2.0
f_hi = 4.5
[sza_regimes.night.F2]
h_lo = 250.0
h_hi = 550.0
sigma_trans_km = 50.0
max_jump_km = 70.0
f_lo = 2.0
f_hi = 12.0

# ---------------------------------------------------------------------------
# RSF Viterbi scaler (rsf_batch_scaler.py / plot_viterbi.py)
# ---------------------------------------------------------------------------
[rsf_scaler]
tuning_preset = "balanced"
e_layer_max_sza = 100.0
rfi_enabled = true
rfi_max_echoes_per_bin = 100
rfi_freq_bin_mhz = 0.05
max_trace_freq_gap_mhz = 1.0
min_trace_reliability = 0.4
min_trace_points = 10
bridge_min_segment_points = 8
bridge_max_height_step_km = 50.0
adaptive_amp_margin_db = 10.0

# Per-station, per-year overrides for scaler behavior that does not
# generalize across stations or sessions. A station/year combination not
# listed here uses the plain SZA-regime defaults above -- add an entry only
# after checking plot_viterbi.py diagnostics for that station/year.
[rsf_scaler.station_overrides.AL945.2024]
rfi_enabled = false
e_skip_sza_f_hi_clamp = true
prefilter_min_amp_dB = { E = 40.0, F2 = 40.0 }

[rsf_scaler.station_overrides.BC840.2024]
rfi_enabled = true
e_skip_sza_f_hi_clamp = true
max_trace_freq_gap_mhz = 0.4
prefilter_min_amp_dB = { E = 55.0, F2 = 55.0 }

[rsf_scaler.station_overrides.AU930.2024]
rfi_enabled = true
e_skip_sza_f_hi_clamp = true
max_trace_freq_gap_mhz = 0.8
prefilter_min_amp_dB = { E = 20.0, F2 = 20.0 }
f2_f_lo_mhz = 4.0
masked_freq_bands_mhz = [[5.15, 5.25], [10.55, 10.65], [10.95, 11.25]]
bridge_trace_gaps = true

# ---------------------------------------------------------------------------
# Plotting defaults
# ---------------------------------------------------------------------------
[viterbi_plot]
ut_start = 0.0
ut_end = 24.0
keep_every = 6
output_dir = "Data/viterbi_diagnostics"

[foe_sza_plot]
parameter = "foE_mhz"
output_dir = "Data/figures/param_vs_sza"

[tsplot]
parameter = "foF2"
output_dir = "Data/figures/timeseries"

# Batch mode: one figure per (discovered station) x (parameter), for every
# station under Data/didbase_giro_scaled/. `make plot-ts` / RSF_TSPLOT_DAILY=1
# uses this to produce one figure per station per DAY (the default);
# RSF_TSPLOT_ALL=1 instead spans the whole downloaded date range per figure.
[tsplot_all]
parameters = ["foF2", "hmF2", "foE", "hE"]
output_dir = "Data/figures/giro_scaled"

# Smoothed overlay on foF2/hmF2 (and any other parameter) time-series plots.
# Any pandas time-offset alias: "15min", "30min", "1h", "2h30min", ... A
# time-based (not fixed-sample-count) rolling mean, so gaps in the native
# sounding cadence don't distort it. Empty string disables the overlay.
[smoothing]
window = "30min"

# ---------------------------------------------------------------------------
# Quality control of downloaded scaled parameters (quality.py)
# ---------------------------------------------------------------------------
[quality]
parameters = ["foF2", "hmF2", "foE", "hE"]
hampel_window_min = 60.0   # rolling-median window for spike detection
hampel_k = 4.0             # spike if |x - median| > k * scaled MAD
max_gap_min = 60.0         # split segments at gaps above max(this, 2.5 * cadence)
min_segment_h = 4.0        # longest clean segment must span at least this long
min_coverage = 0.8         # valid samples / expected samples within that segment
max_spike_frac = 0.10      # fraction of range-valid samples flagged as spikes
max_noise_rel = 3.0        # sample-to-sample noise vs. station/parameter median
[quality.range]            # physical limits [lo, hi]
foF2 = [1.0, 20.0]
hmF2 = [150.0, 600.0]
foE = [0.5, 6.0]
hE = [80.0, 200.0]
[quality.min_scale]        # MAD floor so quantised/flat data are not over-flagged
MHz = 0.1
km = 5.0

# TID-band zero-phase band-pass used in the plots (periods in minutes).
[bandpass]
period_min_short = 15.0
period_min_long = 60.0
nyquist_margin = 2.2   # short limit raised to margin * cadence (15-min cadence -> 33 min)
order = 4
mask_gap_min = 30.0    # band-pass (and red smooth) is blanked inside gaps wider than this

# ---------------------------------------------------------------------------
# Quiet-day curves (quiet_curve.py)
# ---------------------------------------------------------------------------
[quiet_curve]
kp_max = 3.0             # max 3-hourly Kp on the day and the previous day (<=)
symh_min = -30.0         # min SYM-H [nT] on the day and the previous day (>)
ae_max = 500.0           # max AE [nT] on the day and the previous day (<)
min_omni_coverage = 0.8  # fraction of a day's 5-min OMNI samples that must be finite
bin_min = 15.0           # UT time-of-day bin width [min]
min_days = 5             # minimum quiet days contributing to a bin, else NaN
by_year = false          # false: pool years per calendar month; true: curve per month per year
smooth_min = 30.0        # rolling-median smoothing of the per-bin curve [min]; 0 disables (adds *_smooth columns)

# ---------------------------------------------------------------------------
# MSTID signatures vs. the quiet-day baseline (mstid.py)
# ---------------------------------------------------------------------------
[mstid]
null_percentile = 95.0    # a day is "enhanced" if its band-pass RMS exceeds this percentile of the quiet-day RMS
min_null_days = 8         # minimum quiet days (station x param x month) needed to form that reference
min_event_min = 60.0      # an event is an envelope excursion above threshold lasting at least this long
edge_min = 30.0           # ignore envelope within this long of a data-chunk edge (filter/Hilbert edge effects)
terminator_margin_min = 60.0  # flag events whose window +/- this margin spans the solar terminator (SZA=90)
plot = "flagged"          # per-day figures: "flagged" | "all" | "none"  (env MSTID_PLOT overrides)

# ---------------------------------------------------------------------------
# Skymap tilt + wavelet analysis of event days (skymap.py)
# ---------------------------------------------------------------------------
[skymap]
range_min_km = 150.0      # keep F-region echoes only (reject lower-layer and multi-hop ranges)
range_max_km = 450.0
max_zenith_deg = 25.0     # echoes farther than this from zenith are dropped (Kouba et al. 2008)
doppler_mad_k = 3.5       # per-file Doppler distribution filter: |dop - median| <= k * scaled MAD
min_echoes = 150          # minimum filtered echoes per sounding to define a tilt sample
despike_window = 5        # Hampel window [soundings] for the tilt series
despike_k = 4.0
despike_min_scale_deg = 0.3
cadence_min = 7.5         # DDM sounding cadence used for the uniform wavelet grid
morse_gamma = 3.0         # Morse wavelet parameters (Lilly & Olhede 2012), as in the reference paper
morse_beta = 20.0
period_min = 10.0         # wavelet period range [min]
period_max = 120.0
